  <!-- Tawk renders into its own iframes, so CSS in this page can't reach it —
       hiding it on mobile has to go through the widget's own API. onLoad fires
       once the widget is ready; the media-query listener also covers a desktop
       window being resized down (and back up) without a reload. -->
  <script type="text/javascript">
    (function () {
      var mq = window.matchMedia('(max-width: 900px)')
      var ready = false

      function sync() {
        if (!ready) return
        if (mq.matches) Tawk_API.hideWidget()
        else Tawk_API.showWidget()
      }

      Tawk_API.onLoad = function () {
        ready = true
        sync()
      }

      /* addListener is the pre-2019 Safari fallback for addEventListener. */
      if (mq.addEventListener) mq.addEventListener('change', sync)
      else mq.addListener(sync)
    })()
  </script>
