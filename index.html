<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UAE Tax Consultant &amp; VAT Services Company | Saeed Accounting</title>

    <meta
      name="description"
      content="Saeed Accounting provides accounting, bookkeeping, VAT and corporate tax services across the UAE — FTA-compliant registration, filing and advisory for mainland and free zone companies."
    />
    <!-- Poppins is self-hosted (see @font-face in styles.css). Preloading the
         weights used above the fold means the text paints in the real face
         first time, with no swap-induced layout shift. -->
    <!-- The LCP element on mobile is the hero paragraph, not the hero image,
         so the fonts are what gate it. Preloading the hero image here only
         stole early bandwidth from these and pushed LCP out. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/poppins-400.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/poppins-700.woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
